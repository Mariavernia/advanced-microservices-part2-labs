spring:
  application:
    name: inventory

server:
  port: ${SERVER_PORT:8080}

app:
  version: ${APP_VERSION:0.1.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: inventory
    version: ${app.version}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} instance=${HOSTNAME:inventory-local} logger=%logger{36} msg=\"%msg\"%n"
