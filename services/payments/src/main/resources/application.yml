spring:
  application:
    name: payments
server:
  port: ${SERVER_PORT:8080}
app:
  version: ${APP_VERSION:0.1.0}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} instance=${HOSTNAME:payments-local} logger=%logger{36} msg=\"%msg\"%n"
