# Auxiliary ClusterIP Service: routes a different Service port to the same Inventory Pods.
apiVersion: v1
kind: Service
metadata:
  name: inventory-p06-alias
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: REPLACE_WITH_INVENTORY_LABEL
  ports:
    - name: http
      port: 18080
      targetPort: 8080
