apiVersion: v1
kind: Service
metadata:
  name: orders-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: orders-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders-db
spec:
  serviceName: orders-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-db
        app.kubernetes.io/part-of: advanced-orders
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - {name: POSTGRES_DB, value: ordersdb}
            - {name: POSTGRES_USER, value: orders}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: orders-postgres-auth, key: POSTGRES_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U orders -d ordersdb"]
            periodSeconds: 10
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "768Mi"}
          volumeMounts:
            - {name: dbdata, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: dbdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi
        resources:
          requests: {storage: 2Gi}
