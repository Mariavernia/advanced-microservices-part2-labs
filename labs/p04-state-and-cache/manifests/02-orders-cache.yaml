apiVersion: v1
kind: Service
metadata:
  name: orders-cache
spec:
  selector: {app.kubernetes.io/name: orders-cache}
  ports:
    - {name: redis, port: 6379, targetPort: 6379}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-cache
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: orders-cache}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-cache
        app.kubernetes.io/part-of: advanced-orders
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["redis-server"]
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            requests: {cpu: "50m", memory: "160Mi"}
            limits: {cpu: "300m", memory: "256Mi"}
