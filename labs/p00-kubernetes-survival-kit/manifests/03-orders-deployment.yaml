apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/part-of: advanced-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
        app.kubernetes.io/part-of: advanced-orders
        app.kubernetes.io/version: "0.1.0"
    spec:
      containers:
        - name: orders
          image: advms26acr4366001b.azurecr.io/advancedorders/orders:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "0.1.0"
            - name: INVENTORY_BASE_URL
              value: "http://inventory:8080"
