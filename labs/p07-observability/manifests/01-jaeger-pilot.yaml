# P07 pilot: temporary, private Jaeger all-in-one with in-memory storage.
# No PVC, LoadBalancer, Ingress, or cluster-wide permissions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p07-jaeger
  labels:
    app.kubernetes.io/name: p07-jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: p07-jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: p07-jaeger
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
          imagePullPolicy: IfNotPresent
          args:
            - "--set=receivers.otlp.protocols.http.endpoint=0.0.0.0:4318"
            - "--set=receivers.otlp.protocols.grpc.endpoint=0.0.0.0:4317"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: query
              containerPort: 16686
            - name: otlp-http
              containerPort: 4318
            - name: otlp-grpc
              containerPort: 4317
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: query
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: p07-jaeger
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: p07-jaeger
  ports:
    - name: query
      port: 16686
      targetPort: query
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
