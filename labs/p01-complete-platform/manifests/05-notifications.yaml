apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  labels:
    app.kubernetes.io/name: notifications
    app.kubernetes.io/part-of: advanced-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifications
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifications
        app.kubernetes.io/part-of: advanced-orders
        app.kubernetes.io/version: "0.1.0"
    spec:
      containers:
        - name: notifications
          image: advancedorders.azurecr.io/advancedorders/notifications:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "160Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
          env:
            - name: NOTIFICATION_PROVIDER_MODE
              value: "simulated"
            - name: NOTIFICATION_PROVIDER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notifications-provider
                  key: NOTIFICATION_PROVIDER_TOKEN
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
  labels:
    app.kubernetes.io/name: notifications
    app.kubernetes.io/part-of: advanced-orders
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notifications
  ports:
    - name: http
      port: 8080
      targetPort: http
