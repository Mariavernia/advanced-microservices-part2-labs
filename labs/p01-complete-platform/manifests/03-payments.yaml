apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/part-of: advanced-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
        app.kubernetes.io/part-of: advanced-orders
        app.kubernetes.io/version: "0.1.0"
    spec:
      containers:
        - name: payments
          image: advms26acr4366001b.azurecr.io/advancedorders/payments:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "160Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: payments
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/part-of: advanced-orders
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payments
  ports:
    - name: http
      port: 8080
      targetPort: http
